name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: srbasar-frontend-deploy
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/srbasar/srbasar-frontend/dist
  NODE_VERSION: '20'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write production .env
        run: |
          cat > .env <<EOF
          VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          VITE_API_AUTH_URL=${{ vars.VITE_API_AUTH_URL }}
          VITE_API_REF_URL=${{ vars.VITE_API_REF_URL }}
          VITE_API_UPDATE_URL=${{ vars.VITE_API_UPDATE_URL }}
          VITE_API_LINK_URL=${{ vars.VITE_API_LINK_URL }}
          VITE_API_USER_URL=${{ vars.VITE_API_USER_URL }}
          VITE_GITHUB_FRONTEND_URL=${{ vars.VITE_GITHUB_FRONTEND_URL }}
          VITE_GITHUB_BACKEND_URL=${{ vars.VITE_GITHUB_BACKEND_URL }}
          VITE_APP_TITLE=${{ vars.VITE_APP_TITLE }}
          VITE_APP_VERSION=${{ vars.VITE_APP_VERSION }}
          VITE_APP_DESCRIPTION=${{ vars.VITE_APP_DESCRIPTION }}
          VITE_ENABLE_BEZIRK_FILTER=${{ vars.VITE_ENABLE_BEZIRK_FILTER }}
          EOF

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Sync build to server
        run: |
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ env.DEPLOY_PATH }}/"

      - name: Health check
        run: |
          curl --fail --silent --show-error https://nbv-sr-basar.de/ > /dev/null
