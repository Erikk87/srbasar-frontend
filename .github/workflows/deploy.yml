name: Deploy Frontend

# Server-Layout (symmetrisch zu nbv-webservices):
#   main -> /opt/srbasar/srbasar-frontend/dist       https://nbbv-sr-basar.de/
#   dev  -> /opt/srbasar/dev/srbasar-frontend/dist   https://nbbv-sr-basar.de/dev/
# VITE_*-Variablen kommen aus den GitHub-Environments "production" bzw. "dev"
# (Environment-Werte überschreiben gleichnamige Repository-Variablen).

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: srbasar-frontend-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  # Wie auf dem Server (nvm default). Upgrade auf 24 (upstream .nvmrc) separat planen.
  NODE_VERSION: '20'
  # Seit Sept. 2026: nbbv-sr-basar.de (alte Domain nbv-sr-basar.de läuft bis April parallel)
  SITE_DOMAIN: nbbv-sr-basar.de

jobs:
  deploy:
    name: ${{ github.ref_name == 'main' && 'Prod' || 'Dev' }}-Deployment
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Zielumgebung bestimmen
        id: target
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "path=/opt/srbasar/srbasar-frontend/dist" >> "$GITHUB_OUTPUT"
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "url=https://${SITE_DOMAIN}/" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "dev" ]; then
            echo "path=/opt/srbasar/dev/srbasar-frontend/dist" >> "$GITHUB_OUTPUT"
            echo "base=/dev/" >> "$GITHUB_OUTPUT"
            echo "url=https://${SITE_DOMAIN}/dev/" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Kein Deploy-Ziel für Branch $GITHUB_REF_NAME"; exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write .env
        run: |
          cat > .env <<EOF
          VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL }}
          VITE_API_AUTH_URL=${{ vars.VITE_API_AUTH_URL }}
          VITE_API_REF_URL=${{ vars.VITE_API_REF_URL }}
          VITE_API_UPDATE_URL=${{ vars.VITE_API_UPDATE_URL }}
          VITE_API_LINK_URL=${{ vars.VITE_API_LINK_URL }}
          VITE_API_USER_URL=${{ vars.VITE_API_USER_URL }}
          VITE_GITHUB_FRONTEND_URL=${{ vars.VITE_GITHUB_FRONTEND_URL }}
          VITE_GITHUB_BACKEND_URL=${{ vars.VITE_GITHUB_BACKEND_URL }}
          VITE_APP_TITLE=${{ vars.VITE_APP_TITLE }}
          VITE_APP_VERSION=${{ vars.VITE_APP_VERSION }}
          VITE_APP_DESCRIPTION=${{ vars.VITE_APP_DESCRIPTION }}
          VITE_ENABLE_BEZIRK_FILTER=${{ vars.VITE_ENABLE_BEZIRK_FILTER }}
          VITE_SITE_NAME=${{ vars.VITE_SITE_NAME }}
          VITE_SITE_TAGLINE=${{ vars.VITE_SITE_TAGLINE }}
          VITE_OPERATOR_NAME=${{ vars.VITE_OPERATOR_NAME }}
          VITE_CONTACT_EMAIL=${{ vars.VITE_CONTACT_EMAIL }}
          VITE_IMPRINT_URL=${{ vars.VITE_IMPRINT_URL }}
          VITE_PRIVACY_URL=${{ vars.VITE_PRIVACY_URL }}
          VITE_SUPPORT_ENABLED=${{ vars.VITE_SUPPORT_ENABLED }}
          VITE_COMPACT_HEADING=${{ vars.VITE_COMPACT_HEADING }}
          VITE_FIXED_THEME=${{ vars.VITE_FIXED_THEME }}
          VITE_NBBV_FOOTER=${{ vars.VITE_NBBV_FOOTER }}
          VITE_INFO_URL=${{ vars.VITE_INFO_URL }}
          VITE_SITE_LOGO=${{ vars.VITE_SITE_LOGO }}
          VITE_SITE_LOGO_LINK=${{ vars.VITE_SITE_LOGO_LINK }}
          VITE_SITE_LOGO_ALT=${{ vars.VITE_SITE_LOGO_ALT }}
          VITE_NBBV_HEADER=${{ vars.VITE_NBBV_HEADER }}
          EOF

      - name: Build
        env:
          VITE_BASE_PATH: ${{ steps.target.outputs.base }}
        run: npm run build

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Sync build to server
        run: |
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o UserKnownHostsFile=$HOME/.ssh/known_hosts" \
            dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ steps.target.outputs.path }}/"

      - name: Health check
        run: |
          curl --fail --silent --show-error "${{ steps.target.outputs.url }}" > /dev/null
